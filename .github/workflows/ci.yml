# VIVIM-Ω CI — independent confirmation of the numbers the repo self-reports.
#
# fresh-tree will report SKIPPED here (sibling legacy repos live outside this tree
# and their pins don't exist in public snapshots) — loud in the summary, never green.
# The import scan still runs in every layout.
#
# D-362: gate-reproduce re-runs omega:gate from a clean clone and compares the
# structural claims (stage flags, host LOC, test counts) against the COMMITTED
# build/status.json — the honor-system match becomes a mechanical one.
# D-362/D-361: node-canary proves the core canon logic runs under plain Node
# (the production tree is runtime-neutral by the gate's bun-surface stage, D-361).
#
# D-372 Phase 4: Windows lane hardened (serial full gate) but stays informational
# until the soak flake (MCP uv_spawn handle exhaustion under long runs) is
# retired by observation — promoting a flaky lane to required would block the
# team on environment noise. macOS added as a second informational lane.
# D-372 ratification watches ubuntu-required + both informational lanes green
# on one commit; the required-flag flip is the fast follow-up.
name: omega-gate

on:
  push:
    branches: ["omega"]
  pull_request:

jobs:
  gate-ubuntu:
    name: gate (ubuntu, required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run omega:gate

  gate-reproduce:
    name: status.json reproduces from the commit (D-362, required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run tooling/ci/verify-status.ts

  node-canary:
    name: core canon under plain node (D-361/D-362, required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tooling/ci/canon-canary.test.mjs

  test-windows:
    name: gate serial (windows, informational — see header)
    runs-on: windows-latest
    # Informational on purpose: 2-core CI runners shake the timing budgets that
    # are tuned for bigger boxes (see D-317), and long Windows runs can exhaust
    # process handles (MCP uv_spawn EUNKNOWN soak flake, D-368/D-372). Serial
    # full gate here for signal without blocking — the required gate is ubuntu.
    # Promote to required only after sustained green observation + runner sizing
    # that matches the budgets.
    continue-on-error: true
    env:
      OMEGA_TEST_CONCURRENCY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run omega:gate

  test-macos:
    name: gate serial (macos, informational — see header)
    runs-on: macos-latest
    continue-on-error: true
    env:
      OMEGA_TEST_CONCURRENCY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run omega:gate
