[package]
name = "vivim_omega_core"
version = "0.1.0"
edition = "2021"
description = "VIVIM-Omega genesis kernel: single capability graph, self-closing bootstrap, non-plugin state arbitrator, versioned tool contracts, granularity-agnostic manifests, computed centrality, signed provenance."

[dependencies]
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
ed25519-dalek = { version = "=2.0.0", default-features = false, features = ["rand_core", "std"] }
rand = "0.8"
anyhow = "1"

# Pinned to stay compatible with the toolchain available in this
# environment (rustc 1.75); newer releases of these transitive deps
# require edition2024.
zeroize = "=1.7.0"
hashbrown = "=0.14.5"
indexmap = "=2.2.6"
base64ct = "=1.6.0"
